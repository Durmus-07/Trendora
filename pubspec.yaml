name: trendora_app
description: Trendora AI trend analysis application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  webfeed_plus: ^1.1.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.2.0
  workmanager: ^0.9.0+3
  geocoding: ^5.0.0
  speech_to_text: ^7.4.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/trendora_brand_v1.png
